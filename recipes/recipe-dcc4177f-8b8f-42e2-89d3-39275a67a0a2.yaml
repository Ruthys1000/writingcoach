id: recipe-dcc4177f-8b8f-42e2-89d3-39275a67a0a2
name: פנייה רשמית
description: >-
  מכתב רשמי נפתח בפרטי השולח והנמען ובשורת הנדון תופיע מטרת הפנייה. גוף המכתב צריך להיות קצר וענייני ולכלול בקשה ברורה
  לביצוע, ולהסתיים בתודה ובצירוף חתימה אישית.
criteria:
  - id: clear_purpose
    question: האם מטרת הפנייה ברורה מהפסקה הראשונה — מה מבקשים, מודיעים, או מגיבים?
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: 'הנמען של פנייה רשמית צריך להבין מיידית: מה רוצים ממנו? אם עליו לקרוא עמוד שלם לפני שהוא מבין — הפנייה נכשלה.'
      tool: 'פתח בהצהרה ישירה: ''פנייה זו מבקשת...'', ''בזאת אנו מודיעים כי...'', ''בתשובה לפנייתכם מ-[תאריך]...'''
      formula: 'פסקה 1: [מטרת הפנייה] | פסקה 2: [פרטים ונימוקים] | פסקה 3: [בקשה/קריאה לפעולה]'
      before_example: שלום רב, אני פונה אליכם בנוגע לנושא חשוב הקשור לתנאי העסקתי, ובפרט לסוגיית שכר הדירה...
      after_example: בזאת פנייתי לקבלת אישור תוספת שכר בגין עלייה בעלויות מחיה, כמפורט להלן.
  - id: formal_register
    question: האם המשלב הלשוני פורמלי ומתאים לתקשורת מוסדית — ללא ביטויים דבורים, קיצורים או אמוג'י?
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: פנייה רשמית מייצגת אותך ואת הארגון. שפה לא פורמלית עלולה להוביל להתייחסות לא רצינית ולפגוע בסיכויי קבלת הבקשה.
      tool: 'כלל ה''מנהל הבכיר'': קרא את המכתב כאילו אתה מנהל בכיר שלא מכיר אותך. האם השפה הולמת?'
      before_example: היי, ראיתי שיש בעיה עם ה-contract שלי ואני חושב שצריך לדבר על זה.
      after_example: לכבוד מחלקת משאבי אנוש, הנני פונה לבחינה מחדש של תנאי חוזה ההעסקה, לאור השינויים שיפורטו להלן.
  - id: precise_language
    question: האם השפה מדויקת — ללא עמימות, ביטויים מרומזים או מידע חסר (תאריכים, סכומים, פרטים)?
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: עמימות בפנייה רשמית מאפשרת לנמען להתחמק מהתחייבות או לפרש בצורה שלא התכוונת.
      tool: 'בדוק כל פסקה: האם כל שם עצם מלווה בתאריך/סכום/שם ספציפי? ''בקרוב'' → ''15.4.2025'', ''סכום משמעותי'' → ''15,000 ₪''.'
      before_example: בשנים האחרונות חל שינוי בתנאים, ולכן אני מבקש תוספת מסוימת.
      after_example: >-
        מאז ינואר 2023 (2.5 שנים) לא עודכן שכרי, בעוד מדד המחירים עלה ב-12.3%. לפיכך אני מבקש תוספת שכר של 8% החל
        מ-1.7.2025.
  - id: authority_clear
    question: האם ברור מי חותם על הפנייה, מה סמכותו, ומה הגוף שאליו הפנייה מופנית?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: פנייה ללא פרטי שולח/נמען ברורים עשויה להתעכב, לאבד, או לגרום לתגובה לאדם הלא נכון.
      tool: 'תבנית כותרת סטנדרטית: תאריך | לכבוד: [שם, תפקיד, גוף] | מאת: [שם, תפקיד, יחידה] | נושא: [כותרת תמציתית].'
      formula: |-
        תאריך: [DD.MM.YYYY]
        לכבוד: [שם ותפקיד הנמען]
        מאת: [שם ותפקיד השולח]
        נושא: [כותרת תמציתית]
      before_example: לגורם הרלוונטי בנוגע לנושא שדיברנו עליו.
      after_example: >-
        תאריך: 15.3.2025 | לכבוד: גב' נועה שוהם, סמנכ"ל משאבי אנוש | מאת: אבי כהן, מנהל מחלקת לוגיסטיקה | נושא: בקשה
        לעדכון שכר שנתי.
  - id: no_emotional_language
    question: האם הפנייה נטולת שפה רגשית, האשמות, לחץ פסיכולוגי, או גוזמאות?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: שפה רגשית בפנייה רשמית מחלישה את המסר, עלולה לעורר הגנתיות אצל הנמען ולפגוע בסיכויי הצלחה.
      tool: 'כלל ה''גלאי רגש'': חפש מילים כמו: ''כועס'', ''מאוכזב'', ''לא הוגן'', ''שנים אני שותק''. החלף בעובדות.'
      before_example: אני מאוד מאוכזב ממצב זה. אחרי כל מה שהשקעתי, לא ייתכן שלא יתייחסו אלי ברצינות.
      after_example: על אף שלוש פניות קודמות (12.1, 3.2, 15.2.2025) טרם התקבלה תשובה. לפיכך אני פונה בזאת לטיפול דחוף.
  - id: clear_call_to_action
    question: 'האם יש קריאה ברורה לפעולה הכוללת: מה מבקשים, ממי, ועד מתי?'
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: בלי קריאה ברורה לפעולה — הנמען לא יודע מה לעשות עם הפנייה. הפנייה עשויה לשקוע ב'מגירה'.
      tool: 'סיים כל פנייה עם פסקת סגירה: ''אבקש לקבל [X] עד [תאריך]. לשאלות אפשר לפנות אלי ב-[פרטי קשר].'''
      formula: לאור האמור לעיל, אבקש [פעולה ספציפית] עד [תאריך]. לשם כך אפשר לפנות אלי ב-[טלפון/מייל].
      before_example: אני מקווה שתטפלו בנושא ותחזרו אלי.
      after_example: >-
        לאור האמור לעיל, אבקש אישור עדכון השכר עד 31.3.2025. לשאלות ניתן לפנות אלי בדוא"ל: a.cohen@org.il או בטל':
        050-1234567.
  - id: proper_salutation
    question: האם פתיחת המכתב וסגירתו תואמים לנהלי התכתבות רשמית?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: פתיחה וסגירה לא תקניות בפנייה רשמית מסמנות חוסר ניסיון ופוגעות באמינות הפונה.
      tool: 'פתיחות מקובלות: ''לכבוד'', ''הנכבד/ת''. סגירות מקובלות: ''בכבוד רב'', ''בברכה'', ''בהוקרה''. הימנע מ''שלום'' בפנייה רשמית.'
      before_example: היי, מה נשמע? ... אוקיי תודה על הכל, להתראות.
      after_example: לכבוד גב' שוהם, ... בכבוד רב ובתודה מראש, [שם + תפקיד].
