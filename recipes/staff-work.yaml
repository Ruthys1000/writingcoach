# ============================================================
# מתכון: עבודת מטה / מסמך עמדה
# Staff Work / Position Paper Recipe
# ============================================================
id: staff-work
name: "עבודת מטה"
description: "מסמך ניתוח ממליץ (Position Paper). הדגש: קשר ברור בין עובדות להמלצות, הצגת חלופות, והמלצות ניתנות ליישום."

criteria:

  # ---- רובד תשתיתי ----

  - id: executive_summary
    question: "האם פותח המסמך בתקציר מנהלים (עד 3 משפטים) הכולל: הסוגיה, ההמלצה, והנימוק המרכזי?"
    weight: 0.15
    layer: foundational
    micro_lesson:
      why: "בכירים מקבלים עשרות עבודות מטה. אם אין תקציר מנהלים — הם ישלחו בחזרה. תקציר טוב חוסך שעות לכולם."
      tool: "נוסחת ה-3 משפטים: (1) מה הסוגיה/הבעיה, (2) מה ההמלצה, (3) מדוע זו ההמלצה הנכונה."
      formula: "סוגיה: [תיאור תמציתי] | המלצה: [פעולה מוצעת] | נימוק: [הסיבה המרכזית]"
      before_example: "מסמך זה עוסק בבחינת האפשרויות השונות לשדרוג מערכת HR הקיימת ובחינת ספקים חדשים בשוק."
      after_example: "מומלץ לעבור למערכת SAP SuccessFactors עד סוף 2025. הסיבה: המערכת הקיימת אינה תומכת בצרכי הצמיחה. שלוש חלופות נבחנו — SuccessFactors מציעה את יחס העלות-תועלת הטוב ביותר."

  - id: professional_tone
    question: "האם הטון מקצועי, ענייני וסמכותי — ללא לשון בקשה, התנצלות, או שפה חסרת ביטחון?"
    weight: 0.10
    layer: foundational
    micro_lesson:
      why: "עבודת מטה מבטאת עמדה מקצועית. שפה מהססת כמו 'אולי כדאי לשקול' מחלישה את האמינות ומעבירה מסר שגוי."
      tool: "החלף שפת ספק בשפת עמדה: 'אולי' → 'מומלץ', 'נראה כי' → 'הנתונים מראים כי', 'כדאי לבחון' → 'יש לבצע'."
      before_example: "אולי כדאי לשקול להרחיב את הצוות, כי נראה שיש קצת עומס עבודה."
      after_example: "מומלץ להרחיב את הצוות בשני נציגי שירות. הנתונים מראים עומס של 140% בממוצע ב-6 החודשים האחרונים."

  - id: logical_flow
    question: "האם המסמך עוקב אחר זרימה לוגית: רקע → ניתוח → חלופות → המלצה → יישום?"
    weight: 0.10
    layer: foundational
    micro_lesson:
      why: "זרימה לוגית מאפשרת לקורא לעקוב אחר החשיבה ולבחון את ההגיון. מסמך שקופץ בין נושאים מאבד את אמון הקורא."
      tool: "מבנה SPQA: Situation (מצב קיים) → Problem (הבעיה/הסוגיה) → Question (שאלת המחקר) → Answer (ההמלצה)."
      formula: "חלק 1: רקע ומצב קיים | חלק 2: הסוגיה/הבעיה | חלק 3: חלופות שנבחנו | חלק 4: המלצה ונימוקים | חלק 5: תוכנית יישום"
      before_example: "ישנה בעיה בצוות. לפני שנה עשינו סקר. יש שלוש חלופות. המצב הנוכחי קשה. אנו ממליצים על..."
      after_example: "1. רקע: הצוות כולל 12 עובדים ומשרת 450 לקוחות. 2. הסוגיה: גידול של 30% בלקוחות ב-2024 ללא תוספת כוח אדם. 3. חלופות: נבחנו שלש אפשרויות: א) גיוס, ב) מיקור-חוץ, ג) אוטומציה."

  # ---- רובד ספציפי למסמך ----

  - id: facts_to_recommendations
    question: "האם יש קשר מפורש ומובהק בין העובדות/הנתונים שהוצגו לבין כל המלצה?"
    weight: 0.15
    layer: document_specific
    micro_lesson:
      why: "המלצה ללא נתוניים תומכים היא דעה, לא ניתוח מקצועי. הקורא חייב להיות מסוגל לבדוק: 'על בסיס מה הגיעו להמלצה הזו?'"
      tool: "נוסחת Evidence → Insight → Recommendation: לכל המלצה, ציין במפורש: 'על בסיס [נתון X] ניתן להסיק [מסקנה Y], ולכן מומלץ [פעולה Z].'"
      formula: "על בסיס [עובדה/נתון] → [מסקנה ביניים] → לפיכך מומלץ [פעולה]"
      before_example: "לאור המצב הקשה, מומלץ לגייס עובדים נוספים."
      after_example: "זמן הטיפול הממוצע עלה מ-3 ל-7 דקות (נתוני Q3 2024). על בסיס נתון זה, ניתן להסיק כי הצוות הנוכחי אינו מספיק. לפיכך מומלץ לגייס 2 נציגים נוספים."

  - id: actionable_recommendations
    question: "האם כל המלצה כוללת אחראי, פעולה קונקרטית ולוח זמנים — ולא רק כיוון כללי?"
    weight: 0.15
    layer: document_specific
    micro_lesson:
      why: "המלצות כלליות כמו 'לשפר את השירות' לא מניעות פעולה. המלצה טובה ניתנת לתרגום מיידי לתוכנית עבודה."
      tool: "מבחן ה-3 שאלות: האם ניתן לענות: מי? (אחראי), מה? (פעולה קונקרטית), מתי? (לוח זמנים). אם לא — שכתב."
      formula: "[אחראי] יבצע [פעולה ספציפית] עד [תאריך], כאשר [תנאי הצלחה]."
      before_example: "מומלץ לשפר את תהליכי גיוס העובדים."
      after_example: "ממונה גיוס (ראש אגף HR, נועה שוהם) תפרסם 2 מכרזים לנציגי שירות עד 15.4, ותסיים תהליכי גיוס עד 30.6."

  - id: alternatives_considered
    question: "האם הוצגו לפחות 2 חלופות לפני שהומלצה הגישה המועדפת, עם נימוק לדחיית החלופות?"
    weight: 0.15
    layer: document_specific
    micro_lesson:
      why: "מסמך עמדה שמציג רק פתרון אחד נראה שאינו מוטה. הצגת חלופות מחזקת את האמינות ומראה שהנושא נבחן לעומק."
      tool: "מטריצת החלופות: בנה טבלה עם עמודות: 'חלופה | יתרונות | חסרונות | עלות | המלצה'. סיים עם נימוק לבחירה המועדפת."
      formula: "חלופה א': [תיאור] — יתרונות: [רשימה], חסרונות: [רשימה]. חלופה ב': [תיאור]... **מומלצת: חלופה [X] משום [נימוק].**"
      before_example: "הפתרון המוצע הוא מעבר למערכת SAP. זהו הפתרון הטוב ביותר לצרכינו."
      after_example: "נבחנו שלוש חלופות: א) SAP SuccessFactors — עלות גבוהה, תכולה מלאה; ב) Workday — עלות בינונית, אינטגרציה מוגבלת; ג) שמירה על מצב קיים — ללא עלות, אך אינו נותן מענה לצמיחה. **ממליצים על SAP** בשל תמיכה מלאה בצרכי הצמיחה ל-5 שנים."

  - id: background_context
    question: "האם הרקע מספיק לאדם שאינו מכיר את הנושא להבין את הסוגיה ואת חשיבותה?"
    weight: 0.20
    layer: document_specific
    micro_lesson:
      why: "קוראי עבודת מטה הם לרוב מקבלי החלטות שאינם מומחים בתחום הספציפי. ללא הקשר מספיק — הם לא יוכלו להעריך את ההמלצות."
      tool: "כלל ה'עיתונאי': ענה על 5 שאלות בסעיף הרקע: מי? מה? מתי? היכן? ולמה זה חשוב עכשיו?"
      before_example: "המערכת הנוכחית כבר לא מתאימה לצרכינו ויש לשנות אותה."
      after_example: "מערכת ה-HR הנוכחית (SAP R3, הותקנה 2012) אינה תומכת בתהליכי גיוס דיגיטלי ובניהול ביצועים. עם גידול של 40% בכוח האדם צפוי עד 2026, המערכת תגיע לגבול יכולתה ב-Q2 2025."
