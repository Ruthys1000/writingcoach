id: recipe-e0d96bb5-8438-496f-9c95-485fea5f4030
name: מכתב הזמנה
description: מכתב להזמנה לאירוע, כנס או פגישה. דגש על לוגיסטיקה, הנעה לפעולה וערך.
criteria:
  - id: event_clarity
    question: האם מהות האירוע והסיבה להזמנה ברורות מהפסקה הראשונה?
    weight: 0.8
    layer: foundational
    micro_lesson:
      why: הנמען צריך להבין מייד במה מדובר כדי להחליט אם האירוע רלוונטי.
      tool: ציין את שם האירוע ומטרתו בשורה הראשונה.
      formula: 'פסקה 1: מהות האירוע | פסקה 2: לוגיסטיקה | פסקה 3: סדר יום | פסקה 4: RSVP'
      before_example: אנחנו עושים משהו נחמד בשבוע הבא ונשמח שתבוא.
      after_example: הננו מתכבדים להזמינך לכנס השנתי בנושא חדשנות טכנולוגית שיתקיים בסימן פריצות דרך ב-AI.
  - id: logistics_accuracy
    question: 'האם מופיעים כל פרטי הלוגיסטיקה: תאריך, שעה ומיקום?'
    weight: 0.8
    layer: foundational
    micro_lesson:
      why: ללא פרטים מדויקים, הנמען לא יוכל לשריין את המועד ביומנו או להגיע.
      tool: השתמש בפורמט רשימה (Bullets) עבור הפרטים הטכניים.
      formula: '[תאריך] | [שעה] | [מיקום/קישור]'
      before_example: זה יקרה ביום חמישי בערב במשרדים שלנו.
      after_example: האירוע יתקיים ביום חמישי, ה-22.5.2025, בשעה 18:00, באולם הכנסים 'שחם', רחוב הרצל 10, ת"א.
  - id: clear_rsvp
    question: האם יש הנחיה ברורה לאישור הגעה ומועד אחרון לביצוע?
    weight: 0.5
    layer: document_specific
    micro_lesson:
      why: ניהול לוגיסטי של אירוע דורש ידיעה מראש של מספר המשתתפים.
      tool: הוסף קישור לטופס הרשמה או ציין כתובת מייל למענה.
      formula: 'נא אשרו הגעתכם עד ליום [תאריך] בקישור: [X]'
      before_example: תגידו לי אם אתם באים.
      after_example: נא אשרו השתתפותכם בקישור המצורף עד ליום 15.5.2025 לצורך היערכות לוגיסטית.
  - id: agenda_value
    question: האם המכתב מפרט מה הערך המוסף למשתתף (סדר יום, תכנים)?
    weight: 0.5
    layer: content
    micro_lesson:
      why: במציאות של עומס פגישות, המשתתף צריך סיבה טובה להשקיע את זמנו.
      tool: פרט 2-3 נקודות מרכזיות מהתכנית הצפויה.
      formula: 'בתוכנית: [נקודה 1], [נקודה 2]...'
      before_example: יהיה מעניין כדאי לבוא.
      after_example: במהלך המפגש נציג את אסטרטגיית הצמיחה לשנת 2026 ונקיים פאנל מומחים בנושא ייעול תהליכים.
  - id: contact_details
    question: האם צוינו פרטי קשר לשאלות או בקשות מיוחדות (נגישות, אוכל)?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: מענה לצרכים מיוחדים מעלה את שביעות הרצון ומראה על מקצועיות.
      tool: סגור את המכתב בהזמנה ליצירת קשר לבירורים.
      formula: לשאלות נוספות ניתן לפנות ל-[שם] ב-[מייל/טלפון].
      before_example: אם יש בעיה דברו איתנו.
      after_example: 'לשאלות נוספות או לעדכונים בנושא נגישות והעדפות תזונתיות, ניתן לפנות למזכירות בטלפון: 03-1234567.'
