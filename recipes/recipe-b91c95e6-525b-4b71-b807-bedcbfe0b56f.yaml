id: recipe-b91c95e6-525b-4b71-b807-bedcbfe0b56f
name: סיכום דיון
description: >-
  סיכום דיון נפתח בפרטים טכניים (נושא/רקע, משתתפים ותאריך) ומתמקד בתיאור ענייני של עיקרי הדברים או ההחלטות שהתקבלו. החלק
  החשוב ביותר הוא השורה התחתונה. טבלת משימות ברורה, המגדירה בכל סעיף מי האחראי, ומהו לוח הזמן לביצועים.
criteria:
  - id: bottom_line_first
    question: האם הפסקה הראשונה כוללת את 'השורה התחתונה' - ההחלטה המרכזית או תוצאת הדיון?
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: >-
        מנהלים קוראים עשרות מסמכים ביום. הם צריכים לדעת תוך שניות מה ה'שורה התחתונה'. אם הם חייבים לקרוא עד הסוף כדי
        להבין את ההחלטה — המסמך נכשל.
      tool: 'נוסחת BLUF (Bottom Line Up Front): פתח תמיד עם המסקנה, ואחר כך הצג את הנתמכים.'
      formula: 'פסקה 1: [ההחלטה/המסקנה] | פסקה 2: [ההקשר] | פסקה 3: [הפרטים]'
      before_example: >-
        בישיבה שהתקיימה ביום ג' בחדר 204 השתתפו שרה, דוד ומיכל. הנושא הראשון שעלה היה תקציב Q3. לאחר דיון ממושך הוחלט על
        הגדלת התקציב.
      after_example: הוחלט להגדיל את תקציב Q3 ב-15% לטובת פרויקט הדיגיטציה. ההחלטה התקבלה פה אחד. פרטי הישיבה והנימוקים מפורטים להלן.
  - id: formal_language
    question: האם השפה פורמלית, מקצועית, ומשוחררת מסלנג, קיצורים לא רשמיים או שפה מדוברת?
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: סיכום דיון הוא מסמך ארגוני רשמי. שפה לא פורמלית פוגעת באמינות הכותב ובסמכות ההחלטות המתועדות.
      tool: 'כלל ה''עיתון'': בדוק אם הטקסט שלך מתאים לפרסום בעיתון פנים-ארגוני. אם לא — שכתב.'
      before_example: בגדול הגענו למסקנה ש-OK ללכת על האופציה הזאת.
      after_example: הוחלט לאמץ את החלופה השנייה כפתרון המועדף לפרויקט.
  - id: logical_structure
    question: 'האם המסמך מאורגן בצורה לוגית: פתיחה → גוף → סיום עם נושאים ברורים?'
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: מסמך ללא מבנה לוגי מעמיס על הקורא וגורם לאי-הבנות. ארגון נכון מאפשר לקורא לנווט ישירות למידע הרלוונטי לו.
      tool: 'מבנה 3-שכבות: (1) מה הוחלט [שורה תחתונה], (2) מה נדון [גוף], (3) מה עושים עכשיו [פעולות נדרשות].'
      before_example: 'עלתה גם שאלת הספק. נעבור לנושא אחר: התקציב. חזרה לספק: הוחלט להמשיך.'
      after_example: 'נושא 1: ספקים — הוחלט להמשיך עם הספק הנוכחי. נושא 2: תקציב — אושרו 500K₪.'
  - id: neutral_tone
    question: האם הטון ניטרלי ולא מביע דעות אישיות, ביקורת או שיפוטיות?
    weight: 0.2
    layer: foundational
    micro_lesson:
      why: סיכום דיון הוא תיעוד עובדתי — לא מקום לדעות אישיות. שיפוטיות עלולה לפגוע בעמיתים ובאמינות המסמך.
      tool: 'כלל ה''מצלמה'': תאר מה שנאמר ומה הוחלט — לא מה שאתה חושב על כך. אם יש עמדות מנוגדות — תאר אותן בשוויוניות.'
      before_example: דוד העלה טענות לא מבוססות לגבי התקציב. בסוף החליטו לא להקשיב לו.
      after_example: דוד הציג עמדה המתנגדת להגדלת התקציב, תוך הפנייה לנתוני Q2. לאחר דיון אומצה עמדת הרוב.
  - id: synthesis_not_quotes
    question: האם המסמך מציג זיקוק עמדות (synthesis) במקום ציטוטים ישירים מפי המשתתפים?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: >-
        ציטוטים הופכים את הסיכום לפרוטוקול ארוך ומייגע. זיקוק עמדות מאפשר לקורא להבין את ה'תמונה הגדולה' מבלי לקרוא שיחה
        שלמה.
      tool: 'במקום ''X אמר... Y אמר... Z הגיב...'', כתוב ''עלתה מחלוקת לגבי X: עמדת הרוב הייתה A, המיעוט ביקש B. הוחלט על C.'''
      before_example: שרה אמרה שהיא תומכת בפרויקט. דוד אמר שיש בעיות תקציביות. מיכל אמרה שצריך לבדוק את הנתונים.
      after_example: עלתה תמיכה עקרונית בפרויקט (שרה, מיכל) לצד חששות תקציביים (דוד). הוחלט לבצע בדיקת היתכנות עד 15.4.
  - id: action_table
    question: 'האם יש טבלת משימות (או רשימה) ברורה הכוללת: מי אחראי, מה המשימה, ומתי הדדליין?'
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: ללא משימות ברורות עם שמות ותאריכים — הסיכום הופך לנייר ללא ערך. אנשים חוזרים לפגישות הבאות מבלי שיעשו דבר.
      tool: 'טבלת WHO-WHAT-WHEN: עמודות: ''אחראי | משימה | עד תאריך | סטטוס''. מלא אותה בסוף כל ישיבה.'
      formula: |-
        | אחראי | משימה | דדליין | סטטוס |
        |-------|-------|--------|-------|
        | שם   | פעולה | DD/MM  | פתוח  |
      before_example: צריך לבדוק את הנתונים ולשלוח לצוות. גם צריך לדאוג לתקציב.
      after_example: |-
        | אחראי | משימה | דדליין |
        | שרה כהן | הכנת דו"ח נתוני Q2 | 20.4 |
        | דוד לוי | אישור תקציב מול CFO | 22.4 |
  - id: readable_in_30_seconds
    question: האם מי שלא השתתף בדיון יוכל להבין את המסקנות המרכזיות תוך 30 שניות?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: >-
        הסיכום מופץ לאנשים שלא היו בדיון — מנהלים בכירים, שותפים, גורמים חיצוניים. אם הם לא מבינים תוך 30 שניות — הם לא
        יקראו.
      tool: 'מבחן ה-30 שניות: תן למישהו שלא היה בדיון לקרוא רק את 3 הפסקאות הראשונות. שאל: ''מה הוחלט?'' אם הוא לא יודע — שכתב.'
      before_example: הישיבה עסקה בנושאים שונים כולל תקציב, כוח אדם ואסטרטגיה לשנה הבאה.
      after_example: 'שלוש החלטות מרכזיות: (1) הגדלת צוות ב-2 עובדים, (2) הקצאת תקציב נוסף של 200K₪, (3) השקת המוצר ב-Q4.'
  - id: decisions_explicit
    question: האם כל החלטה שהתקבלה מנוסחת בצורה מפורשת ומוגדרת (לא רק 'הוחלט לבדוק' אלא מה בדיוק הוחלט)?
    weight: 0.2
    layer: document_specific
    micro_lesson:
      why: 'החלטות מעומעמות מאפשרות לכל אחד לפרש אחרת ומובילות לחיכוכים. החלטה טובה ניתנת לאימות: ניתן לבדוק אם בוצעה או לא.'
      tool: >-
        נוסחת ה-SMART להחלטה: Specific (מה בדיוק), Measurable (איך נדע שבוצע), Assigned (מי אחראי), Realistic,
        Time-bound (מתי).
      before_example: הוחלט לטפל בנושא הספקים בהמשך.
      after_example: 'הוחלט: דוד לוי יגיש שלוש הצעות מחיר מחדש מספקים חלופיים עד 30.4. ההחלטה הסופית תתקבל בישיבה הבאה ב-5.5.'
