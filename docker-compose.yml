# ============================================================
# WritingCoach — Docker Compose
#
# Usage:
#   Anthropic (cloud):       LLM_PROVIDER=anthropic docker compose up
#   OpenAI-compatible OSS:   LLM_PROVIDER=openai   docker compose up
#   Cohere:                  LLM_PROVIDER=cohere    docker compose up
#   Ollama (local/airgap):   LLM_PROVIDER=ollama   docker compose --profile ollama up
# ============================================================

version: '3.9'

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI-compatible (vLLM, LocalAI, GPT OSS, Azure OpenAI, etc.)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-no-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      # Cohere
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_BASE_URL: ${COHERE_BASE_URL:-https://api.cohere.com/v2}
      COHERE_MODEL: ${COHERE_MODEL:-command-r}
      # Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      RECIPES_DIR: /app/recipes
    volumes:
      # Mount recipes dir so you can add new recipes without rebuilding
      - ./recipes:/app/recipes:ro
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
        required: false

  # ---- Local LLM (airgap mode) ----
  # Start with: docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # Pull the model on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3} && wait"]

volumes:
  ollama_data:
